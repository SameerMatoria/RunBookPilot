# "myapp": a stand-in application service on port 8080, run by its own nginx instance.
pid /run/myapp.pid;
error_log /var/log/myapp/server.log;
worker_processes 1;

events {
    worker_connections 64;
}

http {
    access_log /var/log/myapp/access.log;

    server {
        listen 8080;

        location = /health {
            return 200 "ok\n";
        }

        location / {
            root /var/www/myapp;
        }
    }
}
