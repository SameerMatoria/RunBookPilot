name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: runbookpilot
          POSTGRES_PASSWORD: runbookpilot
          POSTGRES_DB: runbookpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runbookpilot"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest
      # Before the Postgres tests: they recreate the tables, so the database must still be empty here.
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://runbookpilot:runbookpilot@localhost:5432/runbookpilot_test
      - name: Tests (Postgres)
        run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://runbookpilot:runbookpilot@localhost:5432/runbookpilot_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t runbookpilot-backend .
      - name: Build web image
        run: docker build -t runbookpilot-web frontend
      - name: Build sandbox image
        run: docker build -t runbookpilot-sandbox sandbox
      - name: Build demo server image
        run: docker build -f demo-server/Dockerfile -t runbookpilot-demo-server .
